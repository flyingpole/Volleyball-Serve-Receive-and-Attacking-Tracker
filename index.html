<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Volleyball Opponent Attack Tracker - Compact</title>
  <style>
    :root {
      --bg: #f4f4f4;
      --card: #ffffff;
      --text: #111;
      --muted: #666;
      --border: #d5d5d5;
      --libero: #fff4a3;
      --btn: #e9e9e9;
      --btn-dark: #333;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      touch-action: manipulation;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #222;
      color: white;
      padding: 10px;
      text-align: center;
      box-shadow: 0 2px 4px rgba(0,0,0,.2);
    }

    h1 {
      margin: 0;
      font-size: 19px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      align-items: center;
      padding: 9px;
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .controls label {
      font-size: 14px;
      white-space: nowrap;
    }

    button, input {
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #aaa;
      padding: 8px 10px;
    }

    button {
      background: var(--btn);
      cursor: pointer;
      font-weight: 700;
      min-height: 40px;
    }

    button:active {
      transform: scale(.98);
      filter: brightness(.92);
    }

    .danger { background: #ffd8d8; }
    .dark { background: var(--btn-dark); color: white; }
    .team-wrap {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      padding: 10px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 850px) {
      .team-wrap.two-teams {
        grid-template-columns: 1fr 1fr;
      }
    }

    .team {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }

    .team-top {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    .team-name {
      width: 100%;
      font-size: 17px;
      font-weight: 700;
    }

    .summary {
      font-size: 13px;
      line-height: 1.35;
      color: var(--muted);
      text-align: right;
      min-width: 105px;
    }

    .add-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin-bottom: 8px;
    }

    .rankings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 8px 0;
    }

    .ranking-box {
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fafafa;
      padding: 6px;
      font-size: 12px;
    }

    .ranking-title {
      font-weight: 800;
      margin-bottom: 4px;
      text-align: center;
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 32px 1fr;
      gap: 4px;
      padding: 2px 0;
      border-top: 1px solid #eee;
    }

    .ranking-row:first-of-type {
      border-top: 0;
    }

    .ranking-empty {
      color: var(--muted);
      text-align: center;
      padding: 5px 0;
    }

    .add-row input {
      width: 100%;
    }

    .table {
      display: grid;
      gap: 6px;
    }

    .player {
      display: grid;
      grid-template-columns: 58px 1fr;
      gap: 6px;
      align-items: stretch;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px;
      background: #fafafa;
    }

    .player.libero {
      background: var(--libero);
    }

    .jersey {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-right: 1px solid var(--border);
      padding-right: 5px;
      font-weight: 800;
      font-size: 19px;
    }

    .small {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-top: 3px;
      text-align: center;
      line-height: 1.2;
    }

    .button-grid {
      display: grid;
      gap: 5px;
    }

    .receive-row,
    .attack-row {
      display: grid;
      gap: 5px;
    }

    .receive-row {
      grid-template-columns: repeat(4, 1fr);
    }

    .attack-row {
      grid-template-columns: repeat(5, 1fr);
    }

    .button-grid button {
      padding: 7px 0;
      min-height: 39px;
      font-size: 18px;
    }

    .receive { background: #e7f0ff; }
    .kill { background: #d6ffd6; }
    .attempt { background: #eeeeee; }
    .error { background: #ffd6d6; }
    .tipkill { background: #dcffe9; }
    .tip { background: #fff2cc; }

    .history {
      grid-column: 1 / -1;
      font-size: 12px;
      color: #444;
      overflow-wrap: anywhere;
      padding-top: 3px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: #fafafa;
    }

    .legend {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 10px 10px;
      color: #444;
      font-size: 12px;
      line-height: 1.35;
    }

    @media (max-width: 430px) {
      h1 { font-size: 17px; }
      .team-wrap { padding: 6px; gap: 8px; }
      .team { padding: 7px; }
      .team-top { grid-template-columns: 1fr; }
      .summary { text-align: left; }
      .add-row { grid-template-columns: 1fr 1fr; }
      .add-row input { grid-column: 1 / -1; }
      .player { grid-template-columns: 50px 1fr; padding: 5px; }
      .button-grid button { min-height: 36px; font-size: 16px; }
      .rankings { grid-template-columns: 1fr 1fr; gap: 5px; }
      .ranking-box { font-size: 11px; padding: 5px; }
      .ranking-row { grid-template-columns: 28px 1fr; }
    }

    @media print {
      header, .controls, .add-row, .legend button { display: none !important; }
      body { background: white; }
      .team-wrap { display: block; }
      .team { page-break-inside: avoid; box-shadow: none; margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Volleyball Opponent Attack Tracker</h1>
  </header>

  <div class="controls">
    <label><input type="checkbox" id="twoTeamsToggle" /> Scouting mode: track 2 teams</label>
    <button onclick="undoLast()">Undo</button>
    <button onclick="window.print()">Print / Save PDF</button>
    <button class="danger" onclick="resetAll()">Reset</button>
  </div>

  <main id="teams" class="team-wrap"></main>

  <div class="legend">
    Serve receive: 0, 1, 2, 3. Attacks: <b>+</b> kill, <b>.</b> played attempt, <b>-</b> error, <b>T</b> tip kill, <b>t</b> tip not kill.
    Hitting % = (kills - errors) / total attempts. Tip kills count as kills and attempts. Tips that do not score count as attempts.
  </div>

  <script>
    const STORAGE_KEY = "volleyball_attack_tracker_v1";

    let state = {
      twoTeams: false,
      teams: [
        { name: "Team", players: [] },
        { name: "Team 2", players: [] }
      ],
      history: []
    };

    function load() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) state = JSON.parse(saved);
      } catch (e) {
        console.warn("Could not load saved data", e);
      }
      render();
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function sortPlayers(players) {
      players.sort((a, b) => {
        if (a.libero !== b.libero) return a.libero ? -1 : 1;
        const an = Number(a.number), bn = Number(b.number);
        if (!Number.isNaN(an) && !Number.isNaN(bn)) return an - bn;
        return String(a.number).localeCompare(String(b.number));
      });
    }

    function addPlayer(teamIndex, libero = false) {
      const input = document.getElementById(`playerInput-${teamIndex}`);
      const number = input.value.trim();
      if (!number) return;

      const team = state.teams[teamIndex];
      if (team.players.some(p => String(p.number) === String(number))) {
        alert("That player number is already added.");
        return;
      }

      team.players.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
        number,
        libero,
        receive: [],
        attacks: []
      });

      sortPlayers(team.players);
      input.value = "";
      save();
      render();
    }

    function recordReceive(teamIndex, playerId, value) {
      const player = state.teams[teamIndex].players.find(p => p.id === playerId);
      if (!player) return;
      player.receive.push(Number(value));
      state.history.push({ type: "receive", teamIndex, playerId });
      save();
      render();
    }

    function recordAttack(teamIndex, playerId, symbol) {
      const player = state.teams[teamIndex].players.find(p => p.id === playerId);
      if (!player) return;
      player.attacks.push(symbol);
      state.history.push({ type: "attack", teamIndex, playerId });
      save();
      render();
    }

    function undoLast() {
      const last = state.history.pop();
      if (!last) return;
      const player = state.teams[last.teamIndex]?.players.find(p => p.id === last.playerId);
      if (!player) return;
      if (last.type === "receive") player.receive.pop();
      if (last.type === "attack") player.attacks.pop();
      save();
      render();
    }

    function resetAll() {
      if (!confirm("Clear all teams, players, and stats?")) return;
      localStorage.removeItem(STORAGE_KEY);
      state = {
        twoTeams: false,
        teams: [
          { name: "Team", players: [] },
          { name: "Team 2", players: [] }
        ],
        history: []
      };
      render();
    }

    function receiveAverage(player) {
      if (!player.receive.length) return "";
      const avg = player.receive.reduce((a, b) => a + b, 0) / player.receive.length;
      return avg.toFixed(2);
    }

    function attackStats(player) {
      const attacks = player.attacks || [];
      const kills = attacks.filter(x => x === "+" || x === "T").length;
      const errors = attacks.filter(x => x === "-").length;
      const attempts = attacks.length;
      const tipKills = attacks.filter(x => x === "T").length;
      const tips = attacks.filter(x => x === "t").length;
      const pct = attempts ? ((kills - errors) / attempts).toFixed(3) : "";
      return { kills, errors, attempts, tipKills, tips, pct };
    }

    function teamSummary(team) {
      const allReceive = team.players.flatMap(p => p.receive || []);
      const receiveAvg = allReceive.length
        ? (allReceive.reduce((a, b) => a + b, 0) / allReceive.length).toFixed(2)
        : "0.00";

      const allAttacks = team.players.flatMap(p => p.attacks || []);
      const kills = allAttacks.filter(x => x === "+" || x === "T").length;
      const errors = allAttacks.filter(x => x === "-").length;
      const attempts = allAttacks.length;
      const hitPct = attempts ? ((kills - errors) / attempts).toFixed(3) : ".000";

      return { receiveAvg, kills, errors, attempts, hitPct };
    }

    function updateTeamName(teamIndex, value) {
      state.teams[teamIndex].name = value;
      save();
    }

    function renderRankings(team) {
      const srRank = team.players
        .filter(p => (p.receive || []).length)
        .map(p => ({ number: p.number, value: Number(receiveAverage(p)), count: p.receive.length }))
        .sort((a, b) => b.value - a.value || b.count - a.count);

      const hitRank = team.players
        .filter(p => (p.attacks || []).length)
        .map(p => {
          const s = attackStats(p);
          return { number: p.number, value: Number(s.pct), attempts: s.attempts, kills: s.kills, errors: s.errors };
        })
        .sort((a, b) => b.value - a.value || b.attempts - a.attempts);

      return `
        <div class="rankings">
          <div class="ranking-box">
            <div class="ranking-title">Serve Receive Ranking</div>
            ${srRank.length ? srRank.map((r, i) => `
              <div class="ranking-row">
                <div>${i + 1}. #${escapeHtml(r.number)}</div>
                <div>${r.value.toFixed(2)} avg / ${r.count} passes</div>
              </div>
            `).join("") : `<div class="ranking-empty">No serve receive yet</div>`}
          </div>

          <div class="ranking-box">
            <div class="ranking-title">Hitter Ranking</div>
            ${hitRank.length ? hitRank.map((r, i) => `
              <div class="ranking-row">
                <div>${i + 1}. #${escapeHtml(r.number)}</div>
                <div>${r.value.toFixed(3)} HP / ${r.kills}-${r.errors}-${r.attempts}</div>
              </div>
            `).join("") : `<div class="ranking-empty">No attacks yet</div>`}
          </div>
        </div>
      `;
    }

    function renderTeam(team, teamIndex) {
      const s = teamSummary(team);

      return `
        <section class="team">
          <div class="team-top">
            <input class="team-name" value="${escapeHtml(team.name)}" oninput="updateTeamName(${teamIndex}, this.value)" />
            <div class="summary">
              SR Avg: <b>${s.receiveAvg}</b><br>
              Hit %: <b>${s.hitPct}</b><br>
              K: <b>${s.kills}</b> E: <b>${s.errors}</b> TA: <b>${s.attempts}</b>
            </div>
          </div>

          <div class="add-row">
            <input id="playerInput-${teamIndex}" inputmode="numeric" placeholder="Player #" onkeydown="if(event.key==='Enter') addPlayer(${teamIndex}, false)" />
            <button onclick="addPlayer(${teamIndex}, false)">Add Player</button>
            <button onclick="addPlayer(${teamIndex}, true)">Add Libero</button>
          </div>

          ${renderRankings(team)}

          <div class="table">
            ${team.players.length ? team.players.map(p => renderPlayer(p, teamIndex)).join("") : `<div class="empty">Add opponent player numbers to start tracking.</div>`}
          </div>
        </section>
      `;
    }

    function renderPlayer(player, teamIndex) {
      const ra = receiveAverage(player);
      const a = attackStats(player);
      const receiveHistory = (player.receive || []).join(" ");
      const attackHistory = (player.attacks || []).join(" ");

      return `
        <div class="player ${player.libero ? "libero" : ""}">
          <div class="jersey">
            #${escapeHtml(player.number)}
            <div class="small">${player.libero ? "LIBERO" : "PLAYER"}</div>
            <div class="small">SR ${ra || "-"}</div>
            <div class="small">H% ${a.pct || "-"}</div>
          </div>

          <div>
            <div class="button-grid">
              <div class="receive-row">
                <button class="receive" onclick="recordReceive(${teamIndex}, '${player.id}', 0)">0</button>
                <button class="receive" onclick="recordReceive(${teamIndex}, '${player.id}', 1)">1</button>
                <button class="receive" onclick="recordReceive(${teamIndex}, '${player.id}', 2)">2</button>
                <button class="receive" onclick="recordReceive(${teamIndex}, '${player.id}', 3)">3</button>
              </div>

              <div class="attack-row">
                <button class="kill" onclick="recordAttack(${teamIndex}, '${player.id}', '+')">+</button>
                <button class="attempt" onclick="recordAttack(${teamIndex}, '${player.id}', '.')">.</button>
                <button class="error" onclick="recordAttack(${teamIndex}, '${player.id}', '-')">-</button>
                <button class="tipkill" onclick="recordAttack(${teamIndex}, '${player.id}', 'T')">T</button>
                <button class="tip" onclick="recordAttack(${teamIndex}, '${player.id}', 't')">t</button>
              </div>
            </div>

            <div class="history">
              SR: ${receiveHistory || "-"}<br>
              K: ${a.kills} &nbsp; E: ${a.errors} &nbsp; TA: ${a.attempts} &nbsp; HP: ${a.pct || ".000"} &nbsp; Tips: ${a.tipKills}/${a.tips}
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const teamsEl = document.getElementById("teams");
      const visibleTeams = state.twoTeams ? state.teams : [state.teams[0]];
      teamsEl.className = "team-wrap" + (state.twoTeams ? " two-teams" : "");
      teamsEl.innerHTML = visibleTeams.map((team, index) => renderTeam(team, index)).join("");

      const toggle = document.getElementById("twoTeamsToggle");
      toggle.checked = state.twoTeams;
      toggle.onchange = () => {
        state.twoTeams = toggle.checked;
        save();
        render();
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    load();
  </script>
</body>
</html>
