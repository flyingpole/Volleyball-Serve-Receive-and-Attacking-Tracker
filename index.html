<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Volleyball Serve Receive and Attacking Tracker</title>
<style>
:root{--bg:#f4f4f4;--card:#fff;--line:#d6d6d6;--muted:#666;--lib:#fff3a3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111;touch-action:manipulation}header{position:sticky;top:0;z-index:5;background:#222;color:white;text-align:center;padding:10px;box-shadow:0 2px 4px #0003}h1{font-size:18px;margin:0}.controls{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;background:white;padding:8px;border-bottom:1px solid var(--line)}button,input{font-size:16px;border:1px solid #aaa;border-radius:8px;padding:8px 10px}button{font-weight:700;background:#eee;min-height:38px}button:active{transform:scale(.98);filter:brightness(.92)}.danger{background:#ffd8d8}.teams{display:grid;grid-template-columns:1fr;gap:10px;max-width:1100px;margin:0 auto;padding:8px}.teams.two{grid-template-columns:1fr 1fr}.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 1px 4px #0001}.teamTop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.teamName{width:100%;font-weight:800;font-size:17px}.summary{font-size:13px;color:var(--muted);line-height:1.35;text-align:right;min-width:115px}.add{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:8px 0}.rankings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rankBox{border:1px solid var(--line);border-radius:9px;background:#fafafa;padding:6px;font-size:12px}.rankTitle{font-weight:800;text-align:center;margin-bottom:4px}.rankRow{display:grid;grid-template-columns:38px 1fr;gap:4px;border-top:1px solid #eee;padding:3px 2px}.rankRow:first-of-type{border-top:0}.rankRow.best{background:#d6ffd6;border-radius:6px;font-weight:800}.rankRow.worst{background:#ffd6d6;border-radius:6px;font-weight:800}.tag{font-size:10px;font-weight:900;margin-left:4px}.empty{color:var(--muted);text-align:center;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafafa}.players{display:grid;gap:6px}.player{display:grid;grid-template-columns:54px 1fr;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fafafa}.player.libero{background:var(--lib)}.jersey{font-weight:900;font-size:19px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-right:4px}.small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2;margin-top:3px}.grid{display:grid;gap:5px}.receiveRow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.attackRow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.receive{background:#e7f0ff}.kill{background:#d6ffd6}.attempt{background:#eee}.error{background:#ffd6d6}.tipKill{background:#dcffe9}.tip{background:#fff2cc}.history{font-size:12px;color:#444;line-height:1.35;padding-top:4px;overflow-wrap:anywhere}.legend{max-width:1100px;margin:0 auto;padding:0 10px 12px;color:#444;font-size:12px;line-height:1.35}@media(max-width:650px){.teams.two{grid-template-columns:1fr}.teamTop{grid-template-columns:1fr}.summary{text-align:left}.add{grid-template-columns:1fr 1fr}.add input{grid-column:1/-1}.rankings{grid-template-columns:1fr 1fr;gap:5px}.rankBox{font-size:11px;padding:5px}.rankRow{grid-template-columns:34px 1fr}.player{grid-template-columns:50px 1fr;padding:5px}.grid button{font-size:16px;min-height:36px;padding:6px 0}}@media print{header,.controls,.add{display:none}.team{box-shadow:none;break-inside:avoid}body{background:white}}
</style>
</head>
<body>
<header><h1>Volleyball Serve Receive and Attacking Tracker</h1></header>
<div class="controls">
<label><input type="checkbox" id="twoTeams"> Track 2 teams</label>
<button onclick="undoLast()">Undo</button>
<button onclick="window.print()">Print / Save PDF</button>
<button class="danger" onclick="resetAll()">Reset</button>
</div>
<main id="teams" class="teams"></main>
<div class="legend">Serve receive: 0, 1, 2, 3. Attacks: <b>+</b> kill, <b>.</b> played attempt, <b>-</b> error, <b>T</b> tip kill, <b>t</b> tip not kill. Hitting % = (kills - errors) / total attempts. Hitter ranking is sorted worst to best.</div>
<script>
const KEY='vb_sr_attack_tracker_v3';
let state={twoTeams:false,teams:[{name:'Team',players:[]},{name:'Team 2',players:[]}],history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const old=localStorage.getItem('volleyball_attack_tracker_v1')||localStorage.getItem('vb_sr_attack_tracker_v2');const s=localStorage.getItem(KEY)||old;if(s)state=JSON.parse(s)}catch(e){}render()}
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function sortPlayers(ps){ps.sort((a,b)=>a.libero!==b.libero?a.libero?-1:1:Number(a.number)-Number(b.number)||String(a.number).localeCompare(String(b.number)))}
function addPlayer(t,libero){const input=document.getElementById('p'+t);const n=input.value.trim();if(!n)return;const team=state.teams[t];if(team.players.some(p=>String(p.number)===String(n))){alert('That player number is already added.');return}team.players.push({id:uid(),number:n,libero,receive:[],attacks:[]});sortPlayers(team.players);input.value='';save();render()}
function recordReceive(t,id,val){const p=state.teams[t].players.find(x=>x.id===id);if(!p)return;p.receive.push(Number(val));state.history.push({type:'receive',team:t,id});save();render()}
function recordAttack(t,id,sym){const p=state.teams[t].players.find(x=>x.id===id);if(!p)return;p.attacks.push(sym);state.history.push({type:'attack',team:t,id});save();render()}
function undoLast(){const h=state.history.pop();if(!h)return;const p=state.teams[h.team]?.players.find(x=>x.id===h.id);if(!p)return;if(h.type==='receive')p.receive.pop();if(h.type==='attack')p.attacks.pop();save();render()}
function resetAll(){if(!confirm('Clear all teams, players, and stats?'))return;localStorage.removeItem(KEY);localStorage.removeItem('volleyball_attack_tracker_v1');localStorage.removeItem('vb_sr_attack_tracker_v2');state={twoTeams:false,teams:[{name:'Team',players:[]},{name:'Team 2',players:[]}],history:[]};render()}
function receiveAvg(p){if(!p.receive?.length)return'';return (p.receive.reduce((a,b)=>a+b,0)/p.receive.length).toFixed(2)}
function attackStats(p){const a=p.attacks||[];const kills=a.filter(x=>x==='+'||x==='T').length;const errors=a.filter(x=>x==='-').length;const attempts=a.length;const tipKills=a.filter(x=>x==='T').length;const tips=a.filter(x=>x==='t').length;const pct=attempts?((kills-errors)/attempts).toFixed(3):'';return{kills,errors,attempts,tipKills,tips,pct}}
function teamSummary(team){const rec=team.players.flatMap(p=>p.receive||[]);const sr=rec.length?(rec.reduce((a,b)=>a+b,0)/rec.length).toFixed(2):'0.00';const att=team.players.flatMap(p=>p.attacks||[]);const kills=att.filter(x=>x==='+'||x==='T').length;const errors=att.filter(x=>x==='-').length;const attempts=att.length;const hp=attempts?((kills-errors)/attempts).toFixed(3):'.000';return{sr,kills,errors,attempts,hp}}
function rankings(team){const sr=team.players.filter(p=>(p.receive||[]).length).map(p=>({n:p.number,v:Number(receiveAvg(p)),c:p.receive.length})).sort((a,b)=>b.v-a.v||b.c-a.c);const hit=team.players.filter(p=>(p.attacks||[]).length).map(p=>{const s=attackStats(p);return{n:p.number,v:Number(s.pct),a:s.attempts,k:s.kills,e:s.errors}}).sort((a,b)=>a.v-b.v||b.a-a.a);return `<div class="rankings"><div class="rankBox"><div class="rankTitle">Serve Receive Ranking</div>${sr.length?sr.map((r,i)=>`<div class="rankRow"><div>${i+1}. #${esc(r.n)}</div><div>${r.v.toFixed(2)} avg / ${r.c} passes</div></div>`).join(''):'<div class="empty">No serve receive yet</div>'}</div><div class="rankBox"><div class="rankTitle">Hitter Ranking</div>${hit.length?hit.map((r,i)=>{const cls=i===0?'worst':i===hit.length-1?'best':'';const tag=i===0?' <span class="tag">WORST</span>':i===hit.length-1?' <span class="tag">BEST</span>':'';return `<div class="rankRow ${cls}"><div>${i+1}. #${esc(r.n)}</div><div>${r.v.toFixed(3)} HP / ${r.k}-${r.e}-${r.a}${tag}</div></div>`}).join(''):'<div class="empty">No attacks yet</div>'}</div></div>`}
function renderTeam(team,t){const s=teamSummary(team);return `<section class="team"><div class="teamTop"><input class="teamName" value="${esc(team.name)}" oninput="state.teams[${t}].name=this.value;save()"><div class="summary">SR Avg: <b>${s.sr}</b><br>Hit %: <b>${s.hp}</b><br>K: <b>${s.kills}</b> E: <b>${s.errors}</b> TA: <b>${s.attempts}</b></div></div><div class="add"><input id="p${t}" inputmode="numeric" placeholder="Player #" onkeydown="if(event.key==='Enter')addPlayer(${t},false)"><button onclick="addPlayer(${t},false)">Add Player</button><button onclick="addPlayer(${t},true)">Add Libero</button></div>${rankings(team)}<div class="players">${team.players.length?team.players.map(p=>renderPlayer(p,t)).join(''):'<div class="empty">Add opponent player numbers to start tracking.</div>'}</div></section>`}
function renderPlayer(p,t){const ra=receiveAvg(p);const a=attackStats(p);const rh=(p.receive||[]).join(' ');return `<div class="player ${p.libero?'libero':''}"><div class="jersey">#${esc(p.number)}<div class="small">${p.libero?'LIBERO':'PLAYER'}</div><div class="small">SR ${ra||'-'}</div><div class="small">H% ${a.pct||'-'}</div></div><div><div class="grid"><div class="receiveRow"><button class="receive" onclick="recordReceive(${t},'${p.id}',0)">0</button><button class="receive" onclick="recordReceive(${t},'${p.id}',1)">1</button><button class="receive" onclick="recordReceive(${t},'${p.id}',2)">2</button><button class="receive" onclick="recordReceive(${t},'${p.id}',3)">3</button></div><div class="attackRow"><button class="kill" onclick="recordAttack(${t},'${p.id}','+')">+</button><button class="attempt" onclick="recordAttack(${t},'${p.id}', '.')">.</button><button class="error" onclick="recordAttack(${t},'${p.id}', '-')">-</button><button class="tipKill" onclick="recordAttack(${t},'${p.id}', 'T')">T</button><button class="tip" onclick="recordAttack(${t},'${p.id}', 't')">t</button></div></div><div class="history">SR: ${rh||'-'}<br>K: ${a.kills} &nbsp; E: ${a.errors} &nbsp; TA: ${a.attempts} &nbsp; HP: ${a.pct||'.000'} &nbsp; Tips: ${a.tipKills}/${a.tips}</div></div></div>`}
function render(){const el=document.getElementById('teams');const teams=state.twoTeams?state.teams:[state.teams[0]];el.className='teams'+(state.twoTeams?' two':'');el.innerHTML=teams.map((team,i)=>renderTeam(team,i)).join('');const cb=document.getElementById('twoTeams');cb.checked=state.twoTeams;cb.onchange=()=>{state.twoTeams=cb.checked;save();render()}}
load();
</script>
</body>
</html>
