<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Virtual Assistant Coach</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='white' stroke='black' stroke-width='3'/%3E%3Cpath d='M32 2c8 8 10 18 8 30M32 2c-8 8-10 18-8 30M8 18c12 4 24 4 48 0M8 46c12-4 24-4 48 0M24 32c-4 7-5 15-3 25M40 32c4 7 5 15 3 25' fill='none' stroke='black' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f4f4;--card:#fff;--line:#d6d6d6;--muted:#666;--lib:#fff3a3}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111;touch-action:manipulation}header{position:sticky;top:0;z-index:5;background:#222;color:white;text-align:center;padding:4px 8px;box-shadow:0 1px 3px #0003}h1{font-size:16px;margin:0;line-height:1.15}.controls{display:flex;gap:4px;flex-wrap:nowrap;justify-content:center;align-items:center;background:white;padding:4px;border-bottom:1px solid var(--line);overflow-x:auto}.controls label{font-size:12px;white-space:nowrap;flex:0 0 auto}button,input{font-size:14px;border:1px solid #aaa;border-radius:7px;padding:5px 7px}button{font-weight:700;background:#eee;min-height:30px;flex:0 0 auto}button:active{transform:scale(.98);filter:brightness(.92)}button.tapFlash{background:#222!important;color:#fff!important;outline:3px solid #c00}.danger{background:#ffd8d8}.teams{display:grid;grid-template-columns:1fr;gap:10px;max-width:1100px;margin:0 auto;padding:8px}.teams.two{grid-template-columns:1fr 1fr}.team{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 1px 4px #0001}.teamTop{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.teamName{width:100%;font-weight:800;font-size:17px}.summary{font-size:13px;color:var(--muted);line-height:1.35;text-align:right;min-width:115px}.add{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin:8px 0}.rankings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.rankBox{border:1px solid var(--line);border-radius:9px;background:#fafafa;padding:6px;font-size:12px}.rankTitle{font-weight:800;text-align:center;margin-bottom:4px}.rankHead,.rankRow{display:grid;grid-template-columns:32px 1fr 52px;gap:4px;border-top:1px solid #eee;padding:3px 2px}.hitRank .rankHead,.hitRank .rankRow{grid-template-columns:32px 1fr}.rankHead{font-weight:800;color:#444;border-top:0;background:#f1f1f1;border-radius:5px}.empty{color:var(--muted);text-align:center;padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fafafa}.players{display:grid;gap:6px}.player{display:grid;grid-template-columns:54px 1fr;gap:6px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fafafa}.player.libero{background:var(--lib)}.jersey{font-weight:900;font-size:19px;text-align:center;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding-right:4px}.small{font-size:11px;color:var(--muted);font-weight:700;line-height:1.2;margin-top:3px}.lastIndicator{font-size:12px;color:#c00;font-weight:900;line-height:1.15;margin-top:3px}.lastVal{color:#c00;font-weight:900}.grid{display:grid;gap:5px}.receiveRow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.attackRow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.receive{background:#e7f0ff}.kill{background:#d6ffd6}.attempt{background:#eee}.error{background:#ffd6d6}.tipKill{background:#dcffe9}.tip{background:#fff2cc}.history{font-size:12px;color:#444;line-height:1.35;padding-top:4px;overflow-wrap:anywhere}.legend{max-width:1100px;margin:0 auto;padding:0 10px 12px;color:#444;font-size:12px;line-height:1.35}.printSummary{display:none}.printTeam{break-inside:avoid;border:1px solid #999;margin:0 0 10px;padding:8px}.printTeam h2{font-size:16px;margin:0 0 4px}.printGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.printSummary table{width:100%;border-collapse:collapse;font-size:11px}.printSummary th,.printSummary td{border:1px solid #aaa;padding:3px;text-align:left}.printSummary th{background:#eee}@media(max-width:650px){h1{font-size:15px}.controls{justify-content:flex-start}button,input{font-size:13px;padding:4px 6px}button{min-height:28px}.teams.two{grid-template-columns:1fr}.teamTop{grid-template-columns:1fr}.summary{text-align:left}.add{grid-template-columns:1fr 1fr}.add input{grid-column:1/-1}.rankings{grid-template-columns:1fr 1fr;gap:5px}.rankBox{font-size:11px;padding:5px}.rankHead,.rankRow{grid-template-columns:28px 1fr 46px}.hitRank .rankHead,.hitRank .rankRow{grid-template-columns:28px 1fr}.player{grid-template-columns:50px 1fr;padding:5px}.grid button{font-size:16px;min-height:36px;padding:6px 0}}@media print{header,.controls,.add{display:none}.printSummary{display:block;padding:0 0 10px;margin:0 0 12px;border-bottom:2px solid #000}.printSummary h1{font-size:20px;margin:0 0 8px}.team{box-shadow:none;break-inside:avoid}body{background:white}.legend{display:none}.lastVal,.lastIndicator{color:#000}}
</style>
</head>
<body>
<header><h1>Virtual Assistant Coach</h1></header>
<div class="controls"><label><input type="checkbox" id="twoTeams"> Track 2 teams</label><label><input type="checkbox" id="hapticsToggle"> Haptics</label><button onclick="undoLast()">Undo</button><button onclick="window.print()">PDF</button><button class="danger" onclick="resetAll()">Reset</button></div>
<section id="printSummary" class="printSummary"></section><main id="teams" class="teams"></main>
<div class="legend">Serve receive ranking: worst to best by average, using highest 0-pass % as the secondary worse key. Hitter ranking: best to worst by hitting %. Haptics work mainly on Android Chrome.</div>
<script>
const KEY='vb_sr_attack_tracker_v8';let state={twoTeams:false,haptics:true,teams:[{name:'Team',players:[]},{name:'Team 2',players:[]}],history:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function load(){try{const old=localStorage.getItem('vb_sr_attack_tracker_v7')||localStorage.getItem('vb_sr_attack_tracker_v6')||localStorage.getItem('vb_sr_attack_tracker_v5')||localStorage.getItem('vb_sr_attack_tracker_v4')||localStorage.getItem('vb_sr_attack_tracker_v3')||localStorage.getItem('volleyball_attack_tracker_v1')||localStorage.getItem('vb_sr_attack_tracker_v2');const s=localStorage.getItem(KEY)||old;if(s)state=JSON.parse(s);if(state.haptics===undefined)state.haptics=true}catch(e){}render()}
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function uid(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
function sortPlayers(ps){ps.sort((a,b)=>a.libero!==b.libero?a.libero?-1:1:Number(a.number)-Number(b.number)||String(a.number).localeCompare(String(b.number)))}
function addPlayer(t,libero){const input=document.getElementById('p'+t);const n=input.value.trim();if(!n)return;const team=state.teams[t];if(team.players.some(p=>String(p.number)===String(n))){alert('That player number is already added.');return}team.players.push({id:uid(),number:n,libero,receive:[],attacks:[]});sortPlayers(team.players);input.value='';save();render()}
function buzz(pattern){if(state.haptics&&navigator.vibrate)navigator.vibrate(pattern)}
function flashThen(e,fn,pattern){buzz(pattern);const b=e.currentTarget;b.classList.add('tapFlash');setTimeout(()=>{b.classList.remove('tapFlash');fn()},120)}
function tapReceive(e,t,id,val){flashThen(e,()=>recordReceive(t,id,val),60)}function tapAttack(e,t,id,sym){flashThen(e,()=>recordAttack(t,id,sym),60)}
function recordReceive(t,id,val){const p=state.teams[t].players.find(x=>x.id===id);if(!p)return;p.receive.push(Number(val));state.history.push({type:'receive',team:t,id});save();render()}
function recordAttack(t,id,sym){const p=state.teams[t].players.find(x=>x.id===id);if(!p)return;p.attacks.push(sym);state.history.push({type:'attack',team:t,id});save();render()}
function undoLast(){const h=state.history.pop();if(!h)return;const p=state.teams[h.team]?.players.find(x=>x.id===h.id);if(!p)return;if(h.type==='receive')p.receive.pop();if(h.type==='attack')p.attacks.pop();save();render()}
function resetAll(){if(!confirm('Clear all teams, players, and stats?'))return;['vb_sr_attack_tracker_v8','vb_sr_attack_tracker_v7','vb_sr_attack_tracker_v6','vb_sr_attack_tracker_v5','vb_sr_attack_tracker_v4','vb_sr_attack_tracker_v3','volleyball_attack_tracker_v1','vb_sr_attack_tracker_v2'].forEach(k=>localStorage.removeItem(k));state={twoTeams:false,haptics:true,teams:[{name:'Team',players:[]},{name:'Team 2',players:[]}],history:[]};render()}
function receiveAvg(p){if(!p.receive?.length)return'';return (p.receive.reduce((a,b)=>a+b,0)/p.receive.length).toFixed(2)}function zeroPct(p){const r=p.receive||[];if(!r.length)return 0;return r.filter(x=>Number(x)===0).length/r.length}
function attackStats(p){const a=p.attacks||[];const kills=a.filter(x=>x==='+'||x==='T').length;const errors=a.filter(x=>x==='-').length;const attempts=a.length;const tipKills=a.filter(x=>x==='T').length;const tips=a.filter(x=>x==='t').length;const pct=attempts?((kills-errors)/attempts).toFixed(3):'';return{kills,errors,attempts,tipKills,tips,pct}}
function teamSummary(team){const rec=team.players.flatMap(p=>p.receive||[]);const sr=rec.length?(rec.reduce((a,b)=>a+b,0)/rec.length).toFixed(2):'0.00';const att=team.players.flatMap(p=>p.attacks||[]);const kills=att.filter(x=>x==='+'||x==='T').length;const errors=att.filter(x=>x==='-').length;const attempts=att.length;const hp=attempts?((kills-errors)/attempts).toFixed(3):'.000';return{sr,kills,errors,attempts,hp}}
function srRanks(team){return team.players.filter(p=>(p.receive||[]).length).map(p=>({n:p.number,v:Number(receiveAvg(p)),c:p.receive.length,z:zeroPct(p)})).sort((a,b)=>a.v-b.v||b.z-a.z||b.c-a.c)}
function hitRanks(team){return team.players.filter(p=>(p.attacks||[]).length).map(p=>{const s=attackStats(p);return{n:p.number,v:Number(s.pct),a:s.attempts,k:s.kills,e:s.errors}}).sort((a,b)=>b.v-a.v||b.a-a.a)}
function rankings(team){const sr=srRanks(team),hit=hitRanks(team);return `<div class="rankings"><div class="rankBox"><div class="rankTitle">Serve Receive Ranking</div>${sr.length?`<div class="rankHead"><div>#</div><div>Avg</div><div>0%</div></div>`+sr.map((r,i)=>`<div class="rankRow"><div>${i+1}. #${esc(r.n)}</div><div>${r.v.toFixed(2)} / ${r.c} passes</div><div>${Math.round(r.z*100)}%</div></div>`).join(''):'<div class="empty">No serve receive yet</div>'}</div><div class="rankBox hitRank"><div class="rankTitle">Hitter Ranking</div>${hit.length?`<div class="rankHead"><div>#</div><div>HP / K-E-TA</div></div>`+hit.map((r,i)=>`<div class="rankRow"><div>${i+1}. #${esc(r.n)}</div><div>${r.v.toFixed(3)} HP / ${r.k}-${r.e}-${r.a}</div></div>`).join(''):'<div class="empty">No attacks yet</div>'}</div></div>`}
function globalLast(){return state.history[state.history.length-1]||null}
function lastLabel(p,t){const h=globalLast();if(!h||h.team!==t||h.id!==p.id)return '';const val=h.type==='receive'?(p.receive[p.receive.length-1]??''):(p.attacks[p.attacks.length-1]??'');return val!==''?`<div class="lastIndicator">Last: ${esc(val)}</div>`:''}
function histList(arr,type,t,id){if(!arr||!arr.length)return '-';const h=globalLast();const mark=!!h&&h.team===t&&h.id===id&&h.type===type;return arr.map((x,i)=>mark&&i===arr.length-1?`<span class="lastVal">${esc(x)}</span>`:esc(x)).join(' ')}
function renderPrintSummary(){const teams=state.twoTeams?state.teams:[state.teams[0]];document.getElementById('printSummary').innerHTML=`<h1>Virtual Assistant Coach - Match Summary</h1>`+teams.map(team=>{const s=teamSummary(team),sr=srRanks(team),hit=hitRanks(team);return `<div class="printTeam"><h2>${esc(team.name)}</h2><p><b>Team SR Avg:</b> ${s.sr} &nbsp; <b>Team Hit %:</b> ${s.hp} &nbsp; <b>K/E/TA:</b> ${s.kills}/${s.errors}/${s.attempts}</p><div class="printGrid"><div><h3>Serve Receive Ranking</h3>${sr.length?`<table><tr><th>Rank</th><th>Player</th><th>Avg</th><th>0%</th><th>Passes</th></tr>`+sr.map((r,i)=>`<tr><td>${i+1}</td><td>#${esc(r.n)}</td><td>${r.v.toFixed(2)}</td><td>${Math.round(r.z*100)}%</td><td>${r.c}</td></tr>`).join('')+`</table>`:`<p>No serve receive yet</p>`}</div><div><h3>Hitter Ranking</h3>${hit.length?`<table><tr><th>Rank</th><th>Player</th><th>HP</th><th>K</th><th>E</th><th>TA</th></tr>`+hit.map((r,i)=>`<tr><td>${i+1}</td><td>#${esc(r.n)}</td><td>${r.v.toFixed(3)}</td><td>${r.k}</td><td>${r.e}</td><td>${r.a}</td></tr>`).join('')+`</table>`:`<p>No attacks yet</p>`}</div></div></div>`}).join('')}
function renderTeam(team,t){const s=teamSummary(team);return `<section class="team"><div class="teamTop"><input class="teamName" value="${esc(team.name)}" oninput="state.teams[${t}].name=this.value;save();renderPrintSummary()"><div class="summary">SR Avg: <b>${s.sr}</b><br>Hit %: <b>${s.hp}</b><br>K: <b>${s.kills}</b> E: <b>${s.errors}</b> TA: <b>${s.attempts}</b></div></div><div class="add"><input id="p${t}" inputmode="numeric" placeholder="Player #" onkeydown="if(event.key==='Enter')addPlayer(${t},false)"><button onclick="addPlayer(${t},false)">Add Player</button><button onclick="addPlayer(${t},true)">Add Libero</button></div>${rankings(team)}<div class="players">${team.players.length?team.players.map(p=>renderPlayer(p,t)).join(''):'<div class="empty">Add opponent player numbers to start tracking.</div>'}</div></section>`}
function renderPlayer(p,t){const ra=receiveAvg(p),zp=zeroPct(p),a=attackStats(p);return `<div class="player ${p.libero?'libero':''}"><div class="jersey">#${esc(p.number)}<div class="small">${p.libero?'LIBERO':'PLAYER'}</div><div class="small">SR ${ra||'-'}</div><div class="small">0% ${p.receive?.length?Math.round(zp*100)+'%':'-'}</div><div class="small">H% ${a.pct||'-'}</div>${lastLabel(p,t)}</div><div><div class="grid"><div class="receiveRow"><button class="receive" onclick="tapReceive(event,${t},'${p.id}',0)">0</button><button class="receive" onclick="tapReceive(event,${t},'${p.id}',1)">1</button><button class="receive" onclick="tapReceive(event,${t},'${p.id}',2)">2</button><button class="receive" onclick="tapReceive(event,${t},'${p.id}',3)">3</button></div><div class="attackRow"><button class="kill" onclick="tapAttack(event,${t},'${p.id}','+')">+</button><button class="attempt" onclick="tapAttack(event,${t},'${p.id}', '.')">.</button><button class="error" onclick="tapAttack(event,${t},'${p.id}', '-')">-</button><button class="tipKill" onclick="tapAttack(event,${t},'${p.id}', 'T')">T</button><button class="tip" onclick="tapAttack(event,${t},'${p.id}', 't')">t</button></div></div><div class="history">SR: ${histList(p.receive,'receive',t,p.id)}<br>ATT: ${histList(p.attacks,'attack',t,p.id)}<br>K: ${a.kills} &nbsp; E: ${a.errors} &nbsp; TA: ${a.attempts} &nbsp; HP: ${a.pct||'.000'} &nbsp; Tips: ${a.tipKills}/${a.tips}</div></div></div>`}
function render(){const el=document.getElementById('teams');const teams=state.twoTeams?state.teams:[state.teams[0]];el.className='teams'+(state.twoTeams?' two':'');el.innerHTML=teams.map((team,i)=>renderTeam(team,i)).join('');renderPrintSummary();const cb=document.getElementById('twoTeams');cb.checked=state.twoTeams;cb.onchange=()=>{state.twoTeams=cb.checked;save();render()};const hb=document.getElementById('hapticsToggle');hb.checked=state.haptics;hb.onchange=()=>{state.haptics=hb.checked;save()}}
load();
</script>
</body>
</html>
